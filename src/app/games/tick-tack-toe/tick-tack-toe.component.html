<h1>TickTackToe</h1>
<div class="display">
    <div class="game">
        <div class="board">
            @for (mark of cells(); track $index) {
                <button class="Nice" (click)="select($index)"
                    [attr.aria-label]="'Row ' + (rowOf($index) + 1) + ', column ' + (colOf($index) + 1) + ', ' + (mark || 'empty')">{{ mark }}</button>
            }
        </div>
        <div class="reset">
            <button id="Reset" (click)="RESET()">Reset</button>
        </div>
    </div>
</div>
